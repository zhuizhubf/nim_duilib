name: scintilla-extension

on:
  push:
    paths:
      - 'extensions/scintilla/**'
      - 'examples/ScintillaDemo/**'
      - 'bin/resources/themes/default/scintilla/**'
      - 'src/**'
      - 'xmake/**'
      - 'xmake.lua'
      - '.github/workflows/scintilla-extension.yml'
  pull_request:
    paths:
      - 'extensions/scintilla/**'
      - 'examples/ScintillaDemo/**'
      - 'bin/resources/themes/default/scintilla/**'
      - 'src/**'
      - 'xmake/**'
      - 'xmake.lua'
      - '.github/workflows/scintilla-extension.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-skia
            runner: windows-2022
            plat: windows
            arch: x64
            render: skia
            runtime: MT
          - name: windows-x64-gdi
            runner: windows-2022
            plat: windows
            arch: x64
            render: gdi
            runtime: MT
          - name: linux-x64-skia
            runner: ubuntu-22.04
            plat: linux
            arch: x64
            render: skia
            runtime: MT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxtst-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfreetype6-dev libfontconfig1-dev

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.6'

      # 1) 主工程构建：启用 --scintilla=y 时同时构建扩展库与 ScintillaDemo
      - name: Build core + extension + demo (root build)
        shell: bash
        run: |
          set -euo pipefail
          # Windows 上运行在 MSYS/Git Bash 中，需显式指定平台，避免 xmake 识别为 mingw。
          # 配置阶段会下载第三方源码，偶发下载失败时重试。
          for attempt in 1 2 3; do
            if xmake f -y -c -m release -p ${{ matrix.plat }} -a ${{ matrix.arch }} \
                 --render=${{ matrix.render }} --scintilla=y --examples=y; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::xmake configure failed after ${attempt} attempts"
              exit 1
            fi
            echo "xmake configure failed (attempt ${attempt}), retrying ..."
            sleep 10
          done
          xmake -y

      # 2) 核心回归：属性登记表检查不受扩展影响
      - name: Core attribute check
        shell: bash
        run: xmake attribute-check

      # 3) 默认（未启用扩展）构建不受影响
      - name: Build core without extension
        shell: bash
        run: |
          set -euo pipefail
          xmake f -y -c -m release -p ${{ matrix.plat }} -a ${{ matrix.arch }} --render=${{ matrix.render }} --examples=y
          xmake -y
